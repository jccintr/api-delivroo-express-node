openapi: 3.0.3
info:
  title: Delivroo Express API
  description: API de delivery — riders, stores, orders e admin
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Desenvolvimento local

tags:
  - name: Riders
    description: Autenticação e perfil dos entregadores
  - name: Admin
    description: Autenticação e gestão de administradores

paths:
  # =====================
  # RIDERS
  # =====================
  /riders/register:
    post:
      tags: [Riders]
      summary: Cadastrar rider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderRegister'
      responses:
        '201':
          description: Conta criada com sucesso
        '400':
          description: Dados inválidos ou email já cadastrado

  /riders/login:
    post:
      tags: [Riders]
      summary: Login do rider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderLogin'
      responses:
        '200':
          description: Login realizado — retorna token JWT
        '400':
          description: Email ou senha inválidos
        '403':
          description: Conta desativada

  /riders/me:
    get:
      tags: [Riders]
      summary: Dados do rider autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do rider
        '401':
          description: Não autorizado
        '403':
          description: Conta desativada
        '404':
          description: Usuário não encontrado

  # =====================
  # ADMIN
  # =====================
  /admin/register:
    post:
      tags: [Admin]
      summary: Cadastrar admin (registro inicial)
      description: Cria a primeira conta de administrador. Em produção, considere restringir ou remover esta rota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegister'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegisterResponse'
        '400':
          description: Dados inválidos ou email já cadastrado
        '500':
          description: Erro interno do servidor

  /admin/login:
    post:
      tags: [Admin]
      summary: Login do admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
      responses:
        '200':
          description: Login realizado — retorna token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Email ou senha inválidos
        '403':
          description: Conta desativada
        '500':
          description: Erro interno do servidor

  /admin/me:
    get:
      tags: [Admin]
      summary: Dados do admin autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '401':
          description: Não autorizado
        '403':
          description: Conta desativada
        '404':
          description: Usuário não encontrado
        '500':
          description: Erro interno do servidor

  /admin/create:
    post:
      tags: [Admin]
      summary: Criar novo admin (protegido)
      description: Cria um novo administrador. Requer autenticação de um admin já existente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegister'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegisterResponse'
        '400':
          description: Dados inválidos ou email já cadastrado
        '401':
          description: Não autorizado
        '500':
          description: Erro interno do servidor

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ----- Rider -----
    RiderRegister:
      type: object
      required: [name, email, password, phone]
      properties:
        name:
          type: string
          example: João Entregador
        email:
          type: string
          format: email
          example: joao@email.com
        password:
          type: string
          minLength: 3
          example: "123456"
        phone:
          type: string
          example: "11999999999"
        vehicleType:
          type: string
          enum: [Carro, Moto, Bicicleta]
          example: Moto
        doc:
          type: string
          example: "12345678900"

    RiderLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@email.com
        password:
          type: string
          example: "123456"

    # ----- Admin -----
    AdminRegister:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Maria Admin
        email:
          type: string
          format: email
          example: maria@admin.com
        password:
          type: string
          minLength: 3
          example: "123456"

    AdminLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria@admin.com
        password:
          type: string
          example: "123456"

    AdminRegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: Conta criada com sucesso.
        admin:
          $ref: '#/components/schemas/AdminProfile'

    AdminLoginResponse:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: Maria Admin
        email:
          type: string
          format: email
          example: maria@admin.com
        active:
          type: boolean
          example: true
        token:
          type: string
          description: JWT para autenticação nas rotas protegidas
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AdminProfile:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: Maria Admin
        email:
          type: string
          format: email
          example: maria@admin.com
        active:
          type: boolean
          example: true