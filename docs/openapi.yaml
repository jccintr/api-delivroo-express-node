openapi: 3.0.3
info:
  title: Delivroo Express API
  description: API de delivery — riders, stores, orders e admin
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Desenvolvimento local

tags:
  - name: Riders
    description: Autenticação e perfil dos entregadores
  - name: Admin
    description: Autenticação e gestão de administradores
  - name: Stores
    description: Autenticação e perfil das lojas

paths:
  # =====================
  # RIDERS
  # =====================
  /riders/register:
    post:
      tags: [Riders]
      summary: Cadastrar rider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderRegister'
      responses:
        '201':
          description: Conta criada com sucesso
        '400':
          description: Dados inválidos ou email já cadastrado

  /riders/login:
    post:
      tags: [Riders]
      summary: Login do rider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderLogin'
      responses:
        '200':
          description: Login realizado — retorna token JWT
        '400':
          description: Email ou senha inválidos
        '403':
          description: Conta desativada

  /riders/me:
    get:
      tags: [Riders]
      summary: Dados do rider autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do rider
        '401':
          description: Não autorizado
        '403':
          description: Conta desativada
        '404':
          description: Usuário não encontrado

  # =====================
  # ADMIN
  # =====================
  /admin/register:
    post:
      tags: [Admin]
      summary: Cadastrar admin (registro inicial)
      description: Cria a primeira conta de administrador. Em produção, considere restringir ou remover esta rota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegister'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegisterResponse'
        '400':
          description: Dados inválidos ou email já cadastrado
        '500':
          description: Erro interno do servidor

  /admin/login:
    post:
      tags: [Admin]
      summary: Login do admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
      responses:
        '200':
          description: Login realizado — retorna token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Email ou senha inválidos
        '403':
          description: Conta desativada
        '500':
          description: Erro interno do servidor

  /admin/me:
    get:
      tags: [Admin]
      summary: Dados do admin autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '401':
          description: Não autorizado
        '403':
          description: Conta desativada
        '404':
          description: Usuário não encontrado
        '500':
          description: Erro interno do servidor

  /admin/create:
    post:
      tags: [Admin]
      summary: Criar novo admin (protegido)
      description: Cria um novo administrador. Requer autenticação de um admin já existente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegister'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegisterResponse'
        '400':
          description: Dados inválidos ou email já cadastrado
        '401':
          description: Não autorizado
        '500':
          description: Erro interno do servidor

  /admin/riders/{id}/approve:
    patch:
      tags: [Admin]
      summary: Aprovar conta de um rider
      description: Define `accountApprovedAt` com a data/hora atual. Só pode ser feito uma vez por rider.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do rider (MongoDB ObjectId)
          schema:
            type: string
            example: "665f1a2b3c4d5e6f7a8b9c0d"
      responses:
        '200':
          description: Conta aprovada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderActionResponse'
        '400':
          description: Conta já aprovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Conta já aprovada.
        '401':
          description: Não autorizado
        '404':
          description: Entregador não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Entregador não encontrado.
        '500':
          description: Erro interno do servidor

  /admin/riders/{id}/active:
    patch:
      tags: [Admin]
      summary: Ativar ou desativar conta de um rider
      description: Altera o campo `active` do rider. Contas desativadas não conseguem fazer login.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do rider (MongoDB ObjectId)
          schema:
            type: string
            example: "665f1a2b3c4d5e6f7a8b9c0d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRiderActive'
      responses:
        '200':
          description: Status da conta alterado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderActionResponse'
        '400':
          description: Campo active inválido (deve ser boolean)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'O campo "active" deve ser true ou false.'
        '401':
          description: Não autorizado
        '404':
          description: Entregador não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Entregador não encontrado.
        '500':
          description: Erro interno do servidor

  # =====================
  # STORES
  # =====================
  /stores/register:
    post:
      tags: [Stores]
      summary: Cadastrar loja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRegister'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreRegisterResponse'
        '400':
          description: Dados inválidos ou email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email já cadastrado.
        '500':
          description: Erro interno do servidor

  /stores/login:
    post:
      tags: [Stores]
      summary: Login da loja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreLogin'
      responses:
        '200':
          description: Login realizado — retorna token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreLoginResponse'
        '400':
          description: Email ou senha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email ou senha inválidos.
        '403':
          description: Conta desativada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Conta desativada.
        '500':
          description: Erro interno do servidor

  /stores/me:
    get:
      tags: [Stores]
      summary: Dados da loja autenticada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados da loja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProfile'
        '401':
          description: Não autorizado
        '403':
          description: Conta desativada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Conta desativada.
        '404':
          description: Loja não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Loja não encontrada.
        '500':
          description: Erro interno do servidor

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ----- Rider -----
    RiderRegister:
      type: object
      required: [name, email, password, phone]
      properties:
        name:
          type: string
          example: João Entregador
        email:
          type: string
          format: email
          example: joao@email.com
        password:
          type: string
          minLength: 3
          example: "123456"
        phone:
          type: string
          example: "11999999999"
        vehicleType:
          type: string
          enum: [Carro, Moto, Bicicleta]
          example: Moto
        doc:
          type: string
          example: "12345678900"

    RiderLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@email.com
        password:
          type: string
          example: "123456"

    RiderProfile:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: João Entregador
        email:
          type: string
          format: email
          example: joao@email.com
        phone:
          type: string
          example: "11999999999"
        active:
          type: boolean
          example: true
        accountApprovedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-29T20:15:00.000Z"
        vehicle:
          type: object
          properties:
            type:
              type: string
              enum: [Carro, Moto, Bicicleta]
              example: Moto
            model:
              type: string
              nullable: true
            color:
              type: string
              nullable: true
            plate:
              type: string
              nullable: true
        rating:
          type: number
          example: 5
        online:
          type: boolean
          example: false

    RiderActionResponse:
      type: object
      properties:
        message:
          type: string
          example: Conta aprovada com sucesso.
        rider:
          $ref: '#/components/schemas/RiderProfile'

    SetRiderActive:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          description: true = ativar | false = desativar
          example: false

    # ----- Admin -----
    AdminRegister:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Maria Admin
        email:
          type: string
          format: email
          example: maria@admin.com
        password:
          type: string
          minLength: 3
          example: "123456"

    AdminLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria@admin.com
        password:
          type: string
          example: "123456"

    AdminRegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: Conta criada com sucesso.
        admin:
          $ref: '#/components/schemas/AdminProfile'

    AdminLoginResponse:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: Maria Admin
        email:
          type: string
          format: email
          example: maria@admin.com
        active:
          type: boolean
          example: true
        token:
          type: string
          description: JWT para autenticação nas rotas protegidas
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AdminProfile:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: Maria Admin
        email:
          type: string
          format: email
          example: maria@admin.com
        active:
          type: boolean
          example: true

    # ----- Store -----
    StoreRegister:
      type: object
      required: [name, email, password, phone]
      properties:
        name:
          type: string
          example: Pizzaria do Centro
        email:
          type: string
          format: email
          example: contato@pizzaria.com
        password:
          type: string
          minLength: 3
          example: "123456"
        phone:
          type: string
          example: "11988887777"

    StoreLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: contato@pizzaria.com
        password:
          type: string
          example: "123456"

    StoreProfile:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: Pizzaria do Centro
        email:
          type: string
          format: email
          example: contato@pizzaria.com
        phone:
          type: string
          example: "11988887777"
        avatar:
          type: string
          nullable: true
          example: null
        doc:
          type: string
          nullable: true
          example: null
        active:
          type: boolean
          example: true

    StoreRegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: Conta criada com sucesso.
        store:
          $ref: '#/components/schemas/StoreProfile'

    StoreLoginResponse:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: Pizzaria do Centro
        email:
          type: string
          format: email
          example: contato@pizzaria.com
        phone:
          type: string
          example: "11988887777"
        avatar:
          type: string
          nullable: true
        doc:
          type: string
          nullable: true
        active:
          type: boolean
          example: true
        token:
          type: string
          description: JWT para autenticação nas rotas protegidas de store
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # ----- Common -----
    Error:
      type: object
      properties:
        error:
          type: string
          example: Entregador não encontrado.